{% extends "admin/dist/layout.html" %}
{% block title %}Admin | Booking Requests{% endblock %}
{% block content %}
<div class="app-content-header">
  <div class="container-fluid">
    <div class="row">
      <div class="col-sm-6">
        <h3 class="mb-0">Booking Requests</h3>
      </div>
      <div class="col-sm-6">
        <ol class="breadcrumb float-sm-end">
          <li class="breadcrumb-item"><a href="/admin/dashboard">Home</a></li>
          <li class="breadcrumb-item active" aria-current="page">Booking Requests</li>
        </ol>
      </div>
    </div>
  </div>
</div>
<div class="app-content">
  <div class="container-fluid">
    <div class="row">
      <div class="col-12">
        <div class="card">
          <div class="card-body">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 pb-2 admin-table-toolbar">
              <div class="d-flex flex-wrap align-items-center gap-2 admin-table-filters">
                <div class="d-flex align-items-center gap-2 admin-table-show">
                  <label for="perPageSelect" class="form-label mb-0">Show</label>
                  <select id="perPageSelect" class="form-select form-select-sm admin-table-filter-select" style="width: auto;">
                    <option value="5">5</option>
                    <option value="10" selected>10</option>
                    <option value="20">20</option>
                    <option value="50">50</option>
                  </select>
                  <span>entries</span>
                </div>
                <input id="searchInput" type="search" class="form-control form-control-sm admin-table-filter-input"
                  style="width: 220px;"
                  placeholder="Search by name or email" />
                <select id="orderSelect" class="form-select form-select-sm admin-table-filter-select" style="width: 150px;">
                  <option value="desc" selected>Newest First</option>
                  <option value="asc">Oldest First</option>
                </select>
              </div>
              <div class="d-flex flex-wrap align-items-center gap-2 ms-auto">
                <button id="clearBookingRequestsBtn" class="btn btn-outline-danger btn-sm">
                  <i class="bi bi-trash"></i> Clear All
                </button>
              </div>
            </div>
            <div class="table-responsive-wrapper">
              <table class="table table-bordered table-hover">
                <thead class="table-light">
                  <tr>
                    <th>#</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Message</th>
                    <th>Submitted</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="bookingRequestsTableBody">
                  <tr>
                    <td colspan="8" class="text-center">Loading...</td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div class="d-flex justify-content-between align-items-center mt-3">
              <button id="prevPage" class="btn btn-outline-secondary btn-sm">Prev</button>
              <span id="pageInfo"></span>
              <button id="nextPage" class="btn btn-outline-secondary btn-sm">Next</button>
            </div>
            <div id="bookingRequestsModals"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<style>
.msg-text { word-break: break-word; }
.msg-toggle { text-decoration: none; cursor: pointer; }
.msg-toggle:hover { text-decoration: underline; }
</style>

{% endblock %}
