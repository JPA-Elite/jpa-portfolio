{% extends "admin/dist/layout.html" %}
{% block title %}Admin | Music{% endblock %}
{% block content %}
<div class="app-content-header">
  <div class="container-fluid">
    <div class="row">
      <div class="col-sm-6">
        <h3 class="mb-0">Music</h3>
      </div>
      <div class="col-sm-6">
        <ol class="breadcrumb float-sm-end">
          <li class="breadcrumb-item"><a href="/admin/dashboard">Home</a></li>
          <li class="breadcrumb-item active" aria-current="page">Maintenance</li>
          <li class="breadcrumb-item active" aria-current="page">Music</li>
        </ol>
      </div>
    </div>
  </div>
</div>
<div class="app-content">
  <div class="container-fluid">
    <div class="row">
      <div class="col-12">
        <div class="card">
          <div class="card-body">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 pb-2 admin-table-toolbar">
              <div class="d-flex flex-wrap align-items-center gap-2 admin-table-filters">
                <div class="d-flex align-items-center gap-2 admin-table-show">
                  <label for="perPageSelect" class="form-label mb-0">Show</label>
                  <select id="perPageSelect" class="form-select form-select-sm admin-table-filter-select" style="width: auto;">
                    <option value="5">5</option>
                    <option value="10" selected>10</option>
                    <option value="20">20</option>
                    <option value="50">50</option>
                    <option value="500">500</option>
                  </select>
                  <span>entries</span>
                </div>
                <input id="searchInput" type="search" class="form-control form-control-sm admin-table-filter-input"
                  style="width: 220px;"
                  placeholder="Search title or artist" />
                <select id="orderSelect" class="form-select form-select-sm admin-table-filter-select" style="width: 150px;">
                  <option value="desc" selected>Newest First</option>
                  <option value="asc">Oldest First</option>
                </select>
              </div>
              <div class="admin-table-action">
                <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addMusicModal">
                  <i class="bi bi-plus-circle"></i> Add Music
                </button>
              </div>
              <div class="modal fade" id="addMusicModal" tabindex="-1" aria-labelledby="addMusicModalLabel"
                aria-hidden="true">
                <div class="modal-dialog">
                  <div class="modal-content">
                    <div class="modal-header">
                      <h5 class="modal-title me-auto">Add New Music</h5>
                      <div class="d-flex align-items-center gap-1">
                        <button type="button" class="btn p-1 preview-header-btn" id="addMusicMaximizeBtn" aria-label="Maximize" title="Maximize">
                          <i class="bi bi-arrows-fullscreen"></i>
                        </button>
                        <button type="button" class="btn p-1 preview-header-btn" data-bs-dismiss="modal" aria-label="Close">
                          <i class="bi bi-x-lg"></i>
                        </button>
                      </div>
                    </div>
                    <div class="modal-body">
                      <form id="addMusicForm">
                        <div class="mb-3">
                          <label class="form-label">Title <span class="text-danger">*</span></label>
                          <input type="text" class="form-control" id="addTitle" required>
                        </div>
                        <div class="mb-3">
                          <label class="form-label">Artist <span class="text-danger">*</span></label>
                          <input type="text" class="form-control" id="addArtist" required>
                        </div>
                        <div class="mb-3">
                          <label class="form-label">Lyrics</label>
                          <textarea class="form-control" id="addLyrics" rows="6"
                            placeholder="Enter song lyrics (optional)"></textarea>
                        </div>
                        <div class="mb-3">
                          <label class="form-label">Music File <span class="text-danger">*</span></label>
                          <input type="file" class="form-control" id="addMusicFile" accept="audio/*" required>
                        </div>
                        <!-- Desktop (Drag & Drop) -->
                        <div class="mb-3 d-none d-md-block">
                          <label class="form-label">Image File <span class="text-danger">*</span></label>
                          <div id="addDropZone" class="dropzone">
                            <p>Drag & Drop image here, or click to select</p>
                            <input type="file" id="addImageFile" accept="image/*" hidden required>
                          </div>
                        </div>

                        <!-- Mobile (Normal Input) -->
                        <div class="mb-3 d-md-none">
                          <label class="form-label">Image File <span class="text-danger">*</span></label>
                          <input type="file" class="form-control" id="addImageFileMobile" accept="image/*" required>
                        </div>

                      </form>
                    </div>
                    <div class="modal-footer">
                      <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                      <button type="button" class="btn btn-success" id="addMusicBtn"
                        data-loading-text='<span class="spinner-border spinner-border-sm me-2"></span> Saving...'
                        onclick="addMusic()">
                        Save
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="table-responsive-wrapper">
              <table class="table table-bordered table-hover">
                <thead class="table-light">
                  <tr>
                    <th>#</th>
                    <th>Title</th>
                    <th>Artist</th>
                    <th>Play</th>
                    <th>Image</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="musicTableBody">
                  <!-- Default loading row -->
                  <tr>
                    <td colspan="6" class="text-center">Loading...</td>
                  </tr>
                </tbody>
              </table>
            </div>

            <!-- ✅ Pagination Controls -->
            <div class="d-flex justify-content-between align-items-center mt-3">
              <button id="prevPage" class="btn btn-outline-secondary btn-sm">Prev</button>
              <span id="pageInfo"></span>
              <button id="nextPage" class="btn btn-outline-secondary btn-sm">Next</button>
            </div>

            <div id="musicModals"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script type="module" src="{{ static_asset('js/pages/admin/music.js') }}"></script>
{% endblock %}
