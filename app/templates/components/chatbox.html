<!-- Link to the external CSS file for the modal -->
<link rel="stylesheet" href="{{ static_asset('css/components/chatbox.css') }}" />

<div class="chatbox-container">
    <div class="chatbox-icon" onclick="toggleChatbox()">
        <button type="button" class="chatbox-launch-btn" aria-label="{{ _('chat_icon_alt') }}">
            <ion-icon class="chatbox-launch-icon" name="chatbubbles-outline" aria-hidden="true"></ion-icon>
        </button>
    </div>
    <div id="chatboxModal" class="chatbox-modal">
        {% include 'spinners/triple_loading.html' %}
        <div class="chatbox-header">
            <div class="chatbox-header-meta">
                <span class="chatbox-avatar" aria-hidden="true"><img src="{{ profile_image }}" alt="" class="chatbox-avatar__img" loading="lazy" decoding="async"></span>
                <div class="chatbox-header-text">
                    <span class="chatbox-title">{{ _('chat_title') }}</span>
                    <span class="chatbox-status">
                        <span class="chatbox-status-dot" aria-hidden="true"></span>
                        {{ _('chat_status_online') }}
                    </span>
                </div>
            </div>
            <div class="chatbox-header-actions">
                <button class="chatbox-mute-toggle" id="chatMuteToggle" type="button" onclick="toggleChatMute()" aria-label="{{ _('chat_mute_aria') }}" aria-pressed="false">
                    <ion-icon name="volume-high-outline"></ion-icon>
                </button>
                <button class="chatbox-close" type="button" onclick="toggleChatbox()" aria-label="{{ _('chat_close_aria') }}">&times;</button>
            </div>
        </div>
        <div class="chatbox-body">
            <div class="chatbox-help-card">
                <p class="chatbox-help">{{ _('chat_help_message') }}</p>
            </div>
            <div id="chatMessages" class="chat-messages"></div>
            <div id="chatOptionsPanel" class="chat-options-panel">
                <button
                    id="chatOptionsToggle"
                    class="chat-options-toggle"
                    type="button"
                    onclick="toggleChatOptions()"
                    aria-controls="chatOptions"
                    aria-expanded="true">
                    <span class="chat-options-toggle__label">{{ _('chat_quick_questions') }}</span>
                    <span id="chatOptionsCount" class="chat-options-toggle__count">0</span>
                    <ion-icon class="chat-options-toggle__icon" name="chevron-down-outline"></ion-icon>
                </button>
                <div class="chat-options grid" id="chatOptions"></div>
            </div>
        </div>
        <div class="chatbox-footer">
            <div class="chatbox-composer">
                <input
                    id="chatInput"
                    class="chatbox-input"
                    type="text"
                    placeholder="{{ _('chat_input_placeholder') }}"
                    onkeydown="handleChatInputKeydown(event)"
                    autocomplete="off" />
                <button id="sendChat" class="chatbox-send" type="button" onclick="sendMessage()" aria-busy="false">
                    <ion-icon name="paper-plane-outline" aria-hidden="true"></ion-icon>
                    <span>{{ _('chat_send_button') }}</span>
                    <span class="chatbox-send__loader" aria-hidden="true">
                        <span class="chatbox-send__dot"></span>
                        <span class="chatbox-send__dot"></span>
                        <span class="chatbox-send__dot"></span>
                    </span>
                </button>
            </div>
            <button id="clearChat" onclick="clearChat()" style="display: none;">{{ _('chat_clear_button') }}</button>
        </div>
    </div>
</div>
<script>
    window.chatboxI18n = {
        roleYou: {{ _('chat_role_you') | tojson }},
        roleBot: {{ _('chat_role_bot') | tojson }},
        typingAria: {{ _('chat_typing_aria') | tojson }},
        typingMessage: {{ _('chat_typing_message') | tojson }},
        greetingFallback: {{ _('chat_greeting_fallback') | tojson }},
        unknownFallback: {{ _('chat_unknown_fallback') | tojson }},
        unknownFallbackIntro: {{ _('chat_unknown_fallback_intro') | tojson }},
        questionPrefix: {{ _('chat_question_prefix') | tojson }},
        muteAria: {{ _('chat_mute_aria') | tojson }},
        unmuteAria: {{ _('chat_unmute_aria') | tojson }},
    };
</script>
<script src="{{ static_asset('js/components/chatbox.js') }}"></script>
