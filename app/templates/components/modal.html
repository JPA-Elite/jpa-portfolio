<!-- Link to the external CSS file for the modal -->
<link rel="stylesheet" href="{{ static_asset('css/components/modal.css') }}" />

<!-- Modal for previewing the image -->
<div id="imageModal" class="modal" style="display: none;">
    <button type="button" id="imageModalPrev" class="image-modal-nav image-modal-nav--prev" onclick="moveImageModalSlide(-1)" hidden aria-label="Previous image">
        <ion-icon name="chevron-back-outline"></ion-icon>
    </button>
    <button type="button" id="imageModalNext" class="image-modal-nav image-modal-nav--next" onclick="moveImageModalSlide(1)" hidden aria-label="Next image">
        <ion-icon name="chevron-forward-outline"></ion-icon>
    </button>
    <div class="modal-content-container">
        <div class="close" onclick="closeModal()"><ion-icon name="close-circle"></ion-icon></div>
        <img class="modal-content" id="modalImage">
        <video
            class="player"
            style="display: none;"
            id="modalVideo"
            autoplay
            muted
            playsinline
        ></video>
        <div id="caption"></div>
        <div id="imageModalGalleryCounter" class="image-modal-gallery-counter" hidden></div>
        <div class="box-modal-container" style="display: none;">
            <div id="customCarousel" class="carousel">
                <div class="carousel-indicators" id="carouselIndicators"></div>
                <div class="carousel-inner" id="carouselInner"></div>
                <button class="carousel-control prev" onclick="moveSlide(-1)">‹</button>
                <button class="carousel-control next" onclick="moveSlide(1)">›</button>
            </div>
            <div id="carouselDescription" class="carousel-description">
                <h3 id="descriptionTitle"></h3>
                <p id="descriptionText"></p>
            </div>
        </div>
    </div>
        <div class="comment-section">
        <div class="comment-header">
            <span>{{ _('Modal_Comments_Label') }} (<span id="commentCount">0</span>)</span>
            <div class="comment-header__actions">
                <button type="button" class="comment-header-edit-btn" id="commentHeaderEditBtn"
                    aria-label="{{ _('Modal_Edit_Profile_Aria') }}" title="{{ _('Modal_Edit_Profile_Aria') }}">
                    <ion-icon name="pencil-outline"></ion-icon>
                </button>
                <button type="button" class="comment-panel-toggle" id="commentPanelToggle" aria-expanded="false" hidden onclick="toggleCommentPanel(event)">
                    <span class="comment-panel-toggle__label">Expand</span>
                    <ion-icon name="chevron-up-outline"></ion-icon>
                </button>
            </div>
        </div>
        <div class="comment-list"></div>

        <div class="comment-input">
            <div class="comment-input-avatar">
                <img id="commenterAvatar" src="{{ default_avatar_url }}" alt="Your profile picture" />
                <button type="button" class="commenter-edit-btn" id="commenterEditBtn"
                    aria-label="{{ _('Modal_Edit_Profile_Aria') }}" title="{{ _('Modal_Edit_Profile_Aria') }}">
                    <ion-icon name="pencil-outline"></ion-icon>
                </button>
            </div>
            <div class="comment-input-field">
                <input type="text" id="commentBox" placeholder="{{ _('Modal_Comment_Placeholder') }}" />
                <button type="button" class="comment-mic-btn" id="commentMicToggle"
                    aria-label="{{ _('Modal_Insert_Voice') }}" aria-pressed="false">
                    <ion-icon name="mic-outline"></ion-icon>
                </button>
                <button type="button" class="comment-emoji-btn" id="commentEmojiToggle"
                    aria-label="{{ _('Modal_Insert_Emoji') }}" aria-expanded="false">
                    <ion-icon name="happy-outline"></ion-icon>
                </button>
                <div class="comment-emoji-picker" id="commentEmojiPicker" hidden>
                    <button type="button" onclick="insertCommentEmoji('😀')">😀</button>
                    <button type="button" onclick="insertCommentEmoji('😂')">😂</button>
                    <button type="button" onclick="insertCommentEmoji('😍')">😍</button>
                    <button type="button" onclick="insertCommentEmoji('😎')">😎</button>
                    <button type="button" onclick="insertCommentEmoji('🥹')">🥹</button>
                    <button type="button" onclick="insertCommentEmoji('🔥')">🔥</button>
                    <button type="button" onclick="insertCommentEmoji('✨')">✨</button>
                    <button type="button" onclick="insertCommentEmoji('👏')">👏</button>
                    <button type="button" onclick="insertCommentEmoji('❤️')">❤️</button>
                    <button type="button" onclick="insertCommentEmoji('👍')">👍</button>
                    <button type="button" onclick="insertCommentEmoji('🙏')">🙏</button>
                    <button type="button" onclick="insertCommentEmoji('🎉')">🎉</button>
                </div>
            </div>
            <button class="send-btn" onclick="submitComment()">{{ _('Modal_Send') }}</button>
        </div>
    </div>
</div>
<script>
    window.modalI18n = {
        commentsLabel: {{ _('Modal_Comments_Label') | tojson }},
        commentPlaceholder: {{ _('Modal_Comment_Placeholder') | tojson }},
        insertEmoji: {{ _('Modal_Insert_Emoji') | tojson }},
        insertVoice: {{ _('Modal_Insert_Voice') | tojson }},
        micDenied: {{ _('Modal_Mic_Denied') | tojson }},
        send: {{ _('Modal_Send') | tojson }},
        loadPrevious: {{ _('Modal_Load_Previous') | tojson }},
        loading: {{ _('Modal_Loading') | tojson }},
        noCommentsYet: {{ _('Modal_No_Comments') | tojson }},
        failedToLoadComments: {{ _('Modal_Failed_To_Load_Comments') | tojson }},
        commentLike: {{ _('Action_Like') | tojson }},
        commentTooLong: {{ _('Modal_Comment_Too_Long') | tojson }},
        commentAuthorYou: {{ _('Modal_Author_You') | tojson }},
        modalProjectPreview: {{ _('Modal_Project_Preview') | tojson }},
        commentPanelExpand: {{ 'Expand' | tojson }},
        commentPanelCollapse: {{ 'Collapse' | tojson }},
        editNameLimit: {{ _('Modal_Edit_Name_Limit') | tojson }},
        editNameHintOne: {{ _('Modal_Edit_Name_Hint_One') | tojson }},
        editNameHintMany: {{ _('Modal_Edit_Name_Hint_Many') | tojson }},
        editNameRequired: {{ _('Modal_Edit_Name_Required') | tojson }},
        editNameError: {{ _('Modal_Edit_Name_Error') | tojson }},
        editNameSaved: {{ _('Modal_Edit_Name_Saved') | tojson }},
        viewAvatar: {{ _('Modal_View_Avatar_Aria') | tojson }},
        avatarTooLarge: {{ _('Modal_Avatar_Too_Large') | tojson }},
        avatarSaved: {{ _('Modal_Avatar_Saved') | tojson }},
        avatarUploadError: {{ _('Modal_Avatar_Upload_Error') | tojson }},
        avatarRemoved: {{ _('Modal_Avatar_Removed') | tojson }},
        avatarLimit: {{ _('Modal_Avatar_Limit') | tojson }},
        avatarHintOne: {{ _('Modal_Avatar_Hint_One') | tojson }},
        avatarHintMany: {{ _('Modal_Avatar_Hint_Many') | tojson }},
        avatarRemoveConfirm: {{ _('Modal_Avatar_Remove_Confirm') | tojson }},
        avatarRemoveConfirmDesc: {{ _('Modal_Avatar_Remove_Confirm_Desc') | tojson }},
        confirmAction: {{ _('Action_Confirm') | tojson }},
        cancelAction: {{ _('Action_Cancel') | tojson }},
        deleteCommentTitle: {{ _('Modal_Delete_Comment_Title') | tojson }},
        removeCommentLabel: {{ _('Modal_Remove_Comment_Label') | tojson }},
        deleteCommentMsg: {{ _('Modal_Delete_Comment_Msg') | tojson }},
        deleteAllTitle: {{ _('Modal_Delete_All_Title') | tojson }},
        deleteAllMsg: {{ _('Modal_Delete_All_Msg') | tojson }},
        commentDeleted: {{ _('Modal_Comment_Deleted') | tojson }},
        commentsDeleted: {{ _('Modal_Comments_Deleted') | tojson }},
        deleteError: {{ _('Modal_Delete_Error') | tojson }},
    };
</script>
