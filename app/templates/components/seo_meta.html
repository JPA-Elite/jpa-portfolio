<title>{{ page_seo.title }}</title>
<meta name="description" content="{{ page_seo.description }}">
{% if page_seo.keywords %}<meta name="keywords" content="{{ page_seo.keywords }}">
{% endif %}<meta name="author" content="{{ page_seo.author }}">
<meta name="robots" content="{{ page_seo.robots }}">
{% if page_seo.canonical %}<link rel="canonical" href="{{ page_seo.canonical }}">
{% endif %}<meta property="og:type" content="{{ page_seo.og_type }}">
<meta property="og:site_name" content="{{ page_seo.site_name }}">
<meta property="og:title" content="{{ page_seo.title }}">
<meta property="og:description" content="{{ page_seo.description }}">
{% if page_seo.canonical %}<meta property="og:url" content="{{ page_seo.canonical }}">
{% endif %}{% if page_seo.image %}<meta property="og:image" content="{{ page_seo.image }}">
{% endif %}<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page_seo.title }}">
<meta name="twitter:description" content="{{ page_seo.description }}">
{% if page_seo.image %}<meta name="twitter:image" content="{{ page_seo.image }}">
{% endif %}
