{% extends "admin/dist/layout.html" %}

{% block title %}Admin | Server Channels{% endblock %}

{% block content %}
<div class="app-content-header">
  <div class="container-fluid">
    <div class="row">
      <div class="col-sm-6">
        <h3 class="mb-0">Server Community Channels</h3>
      </div>
      <div class="col-sm-6">
        <ol class="breadcrumb float-sm-end">
          <li class="breadcrumb-item"><a href="/admin/dashboard">Home</a></li>
          <li class="breadcrumb-item active" aria-current="page">Server Community</li>
          <li class="breadcrumb-item active" aria-current="page">Channels</li>
        </ol>
      </div>
    </div>
  </div>
</div>

<div class="app-content">
  <div class="container-fluid">
    <div class="card">
      <div class="card-body">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 pb-3 admin-table-toolbar">
          <div class="d-flex flex-wrap align-items-center gap-2 admin-table-filters">
            <div class="admin-table-show">
              <label for="perPageSelect" class="form-label mb-0">Show</label>
              <select id="perPageSelect" class="form-select form-select-sm admin-table-filter-select" style="width:auto;">
                <option value="5">5</option>
                <option value="10" selected>10</option>
                <option value="20">20</option>
              </select>
              <span>entries</span>
            </div>
            <input id="searchInput" type="search" class="form-control form-control-sm admin-table-filter-input" style="width: 220px;"
              placeholder="Search name, slug, type, or description" />
            <select id="orderSelect" class="form-select form-select-sm admin-table-filter-select" style="width: 150px;">
              <option value="desc" selected>Newest First</option>
              <option value="asc">Oldest First</option>
            </select>
            <select id="channelTypeFilterSelect" class="form-select form-select-sm admin-table-filter-select" style="width: 150px;">
              <option value="">All Types</option>
              <option value="general">General</option>
              <option value="business">Business</option>
              <option value="custom">Custom</option>
              <option value="concern">Concern</option>
            </select>
            <select id="visibilityFilterSelect" class="form-select form-select-sm admin-table-filter-select" style="width: 150px;">
              <option value="">All Visibility</option>
              <option value="public">Public</option>
              <option value="private">Private</option>
            </select>
          </div>
          <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addServerChannelModal">
            <i class="bi bi-plus-circle"></i> Add Channel
          </button>
        </div>

        <div class="table-responsive-wrapper">
          <table class="table table-bordered table-hover">
            <thead class="table-light">
              <tr>
                <th>#</th>
                <th>Name</th>
                <th>Slug</th>
                <th>Type</th>
                <th>Visibility</th>
                <th>Members</th>
                <th>Description</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="serverChannelsTableBody">
              <tr><td colspan="8" class="text-center">Loading...</td></tr>
            </tbody>
          </table>
        </div>

        <div class="d-flex justify-content-between align-items-center mt-3">
          <button id="prevPage" class="btn btn-outline-secondary btn-sm">Prev</button>
          <span id="pageInfo"></span>
          <button id="nextPage" class="btn btn-outline-secondary btn-sm">Next</button>
        </div>

        <div id="serverChannelModals"></div>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="addServerChannelModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Add Server Channel</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="addServerChannelForm">
          <div class="mb-3">
            <label class="form-label">Name</label>
            <input id="addName" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea id="addDescription" class="form-control" rows="2"></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label">Type</label>
            <select id="addType" class="form-select">
              <option value="custom" selected>Custom</option>
              <option value="business">Business</option>
              <option value="general">General</option>
            </select>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="addIsPublic" checked>
            <label class="form-check-label" for="addIsPublic">Public channel</label>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-success" id="addServerChannelBtn"
          data-loading-text='<span class="spinner-border spinner-border-sm me-2"></span> Saving...'
          onclick="addServerChannel()">
          Save
        </button>
      </div>
    </div>
  </div>
</div>

<script type="module" src="{{ static_asset('js/pages/admin/server-channels.js') }}"></script>
{% endblock %}
