{% extends "admin/dist/layout.html" %}

{% block title %}Admin | Settings{% endblock %}

{% block content %}
<div class="app-content-header">
  <div class="container-fluid">
    <div class="row">
      <div class="col-sm-6">
        <h3 class="mb-0">Settings</h3>
      </div>
      <div class="col-sm-6">
        <ol class="breadcrumb float-sm-end">
          <li class="breadcrumb-item"><a href="/admin/dashboard">Home</a></li>
          <li class="breadcrumb-item active" aria-current="page">Settings</li>
        </ol>
      </div>
    </div>
  </div>
</div>
<div class="app-content">
  <div class="container-fluid">
    <div class="row mt-4">
      <div class="col-md-12">
        <div class="card">
          <div class="card-header">
            <h3 class="card-title"><i class="bi bi-person-circle me-2"></i>Profile Settings</h3>
          </div>
          <div class="card-body">
            <form id="profileForm">
              <div class="row g-3 align-items-start">
                <div class="col-lg-4 col-md-5">
                  <label for="profileImage" class="form-label">Profile Image</label>
                  <div class="d-flex flex-column align-items-start gap-2">
                    <img
                      id="profileImagePreview"
                      src="{{ session.get('profile_image') or url_for('static', filename='admin/assets/img/admin.webp') }}"
                      alt="Admin profile image"
                      class="rounded-circle border"
                      style="width: 96px; height: 96px; object-fit: cover;"
                    >
                    <input type="file" class="form-control" id="profileImage" name="profileImage" accept="image/*">
                    <small class="text-muted">Optional. Upload a new image to update avatar.</small>
                  </div>
                  <small id="profileImageError" class="text-danger d-none"></small>
                </div>

                <div class="col-lg-8 col-md-7">
                  <div class="row g-3">
                    <div class="col-12">
                      <label for="username" class="form-label">Username</label>
                      <input type="text" class="form-control" id="username" name="username" value="{{ session.get('username', '') }}">
                      <small id="usernameError" class="text-danger d-none"></small>
                    </div>
                    <div class="col-md-6">
                      <label for="password" class="form-label">Password</label>
                      <input type="password" class="form-control" id="password" name="password" placeholder="Enter new password">
                      <small id="passwordError" class="text-danger d-none"></small>
                    </div>
                    <div class="col-md-6">
                      <label for="confirmPassword" class="form-label">Confirm Password</label>
                      <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="Confirm new password">
                      <small id="confirmPasswordError" class="text-danger d-none"></small>
                    </div>
                  </div>
                </div>
              </div>
              <button type="submit" class="btn btn-primary mt-3">Save Changes</button>
            </form>
            <div id="responseMessage" class="mt-3"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script type="module" src="{{ static_asset('js/pages/admin/settings.js') }}"></script>
{% endblock %}
