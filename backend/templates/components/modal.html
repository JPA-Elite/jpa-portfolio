<!-- Link to the external CSS file for the modal -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/components/modal.css') }}" />

<!-- Modal for previewing the image -->
<div id="imageModal" class="modal" style="display: none;">
    <button type="button" id="imageModalPrev" class="image-modal-nav image-modal-nav--prev" onclick="moveImageModalSlide(-1)" hidden aria-label="Previous image">
        <ion-icon name="chevron-back-outline"></ion-icon>
    </button>
    <button type="button" id="imageModalNext" class="image-modal-nav image-modal-nav--next" onclick="moveImageModalSlide(1)" hidden aria-label="Next image">
        <ion-icon name="chevron-forward-outline"></ion-icon>
    </button>
    <div class="modal-content-container">
        <div class="close" onclick="closeModal()"><ion-icon name="close-circle"></ion-icon></div>
        <img class="modal-content" id="modalImage">
        <video
            class="player"
            style="display: none;"
            id="modalVideo"
            autoplay
            muted
            playsinline
        ></video>
        <div id="caption"></div>
        <div id="imageModalGalleryCounter" class="image-modal-gallery-counter" hidden></div>
        <div class="box-modal-container" style="display: none;">
            <div id="customCarousel" class="carousel">
                <div class="carousel-indicators" id="carouselIndicators"></div>
                <div class="carousel-inner" id="carouselInner"></div>
                <button class="carousel-control prev" onclick="moveSlide(-1)">‹</button>
                <button class="carousel-control next" onclick="moveSlide(1)">›</button>
            </div>
            <div id="carouselDescription" class="carousel-description">
                <h3 id="descriptionTitle"></h3>
                <p id="descriptionText"></p>
            </div>
        </div>
    </div>
        <div class="comment-section">
        <div class="comment-header">
            <span>{{ _('Modal_Comments_Label') }} (<span id="commentCount">0</span>)</span>
        </div>
        <div class="comment-list"></div>

        <div class="comment-input">
            <img src="/static/images/user.webp" alt="Your profile picture" />
            <div class="comment-input-field">
                <input type="text" id="commentBox" placeholder="{{ _('Modal_Comment_Placeholder') }}" />
                <button type="button" class="comment-emoji-btn" id="commentEmojiToggle"
                    aria-label="{{ _('Modal_Insert_Emoji') }}" aria-expanded="false">
                    <ion-icon name="happy-outline"></ion-icon>
                </button>
                <div class="comment-emoji-picker" id="commentEmojiPicker" hidden>
                    <button type="button" onclick="insertCommentEmoji('😀')">😀</button>
                    <button type="button" onclick="insertCommentEmoji('😂')">😂</button>
                    <button type="button" onclick="insertCommentEmoji('😍')">😍</button>
                    <button type="button" onclick="insertCommentEmoji('😎')">😎</button>
                    <button type="button" onclick="insertCommentEmoji('🥹')">🥹</button>
                    <button type="button" onclick="insertCommentEmoji('🔥')">🔥</button>
                    <button type="button" onclick="insertCommentEmoji('✨')">✨</button>
                    <button type="button" onclick="insertCommentEmoji('👏')">👏</button>
                    <button type="button" onclick="insertCommentEmoji('❤️')">❤️</button>
                    <button type="button" onclick="insertCommentEmoji('👍')">👍</button>
                    <button type="button" onclick="insertCommentEmoji('🙏')">🙏</button>
                    <button type="button" onclick="insertCommentEmoji('🎉')">🎉</button>
                </div>
            </div>
            <button class="send-btn" onclick="submitComment()">{{ _('Modal_Send') }}</button>
        </div>
    </div>
</div>
<script>
    window.modalI18n = {
        commentsLabel: {{ _('Modal_Comments_Label') | tojson }},
        commentPlaceholder: {{ _('Modal_Comment_Placeholder') | tojson }},
        insertEmoji: {{ _('Modal_Insert_Emoji') | tojson }},
        send: {{ _('Modal_Send') | tojson }},
        loadPrevious: {{ _('Modal_Load_Previous') | tojson }},
        loading: {{ _('Modal_Loading') | tojson }},
        noCommentsYet: {{ _('Modal_No_Comments') | tojson }},
        failedToLoadComments: {{ _('Modal_Failed_To_Load_Comments') | tojson }},
        commentLike: {{ _('Action_Like') | tojson }},
        commentTooLong: {{ _('Modal_Comment_Too_Long') | tojson }},
        commentAuthorYou: {{ _('Modal_Author_You') | tojson }},
        modalProjectPreview: {{ _('Modal_Project_Preview') | tojson }},
    };
</script>
