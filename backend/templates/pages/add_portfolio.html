<!-- templates/add_portfolio.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    {% set seo_title = "Add Portfolio" %}
    {% set seo_description = "Add portfolio details and information." %}
    {% set seo_keywords = "portfolio, form" %}
    {% set seo_robots = "noindex,nofollow" %}
    {% include 'components/seo_meta.html' %}
</head>
<body>
    <h1>Add Portfolio Entry</h1>
    <form action="{{ url_for('api.add_portfolio') }}" method="POST">
        <label for="id">ID:</label>
        <input type="text" id="id" name="id"><br><br>

        <label for="name">Name:</label>
        <input type="text" id="name" name="name"><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email"><br><br>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
