<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title or "Server Login" }}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="{{ static_asset('css/pages/server.css') }}" />
</head>
<body class="server-community-page">
  <div class="server-auth-wrapper">
    <div class="server-auth-card">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="server-alert server-alert-{{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <h2>Login to Server Community</h2>
      <p class="server-auth-meta">Use your username/email and password to continue.</p>

      <form method="post">
        <div class="mb-3">
          <label for="login" class="form-label">Username or Email</label>
          <input id="login" name="login" type="text" class="form-control" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input id="password" name="password" type="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Login</button>
      </form>
      <div class="server-auth-divider"><span>or</span></div>
      <button id="serverGoogleLoginBtn" type="button" class="btn btn-outline-light w-100 server-google-btn">
        <i class="bi bi-google"></i>
        Sign in with Google
      </button>

      <div class="server-auth-links">
        <a class="server-auth-link" href="{{ url_for('pages.server_forgot_password') }}">Forgot Password</a>
        <a class="server-auth-link" href="{{ url_for('pages.server_register') }}">Create Account</a>
      </div>
    </div>
  </div>
  <script>
    window.serverAuthConfig = {
      firebase: {{ firebase_client_config | tojson }},
      mode: "login",
      googleButtonId: "serverGoogleLoginBtn"
    };
  </script>
  <script type="module" src="{{ static_asset('js/pages/server/auth.js') }}"></script>
</body>
</html>
