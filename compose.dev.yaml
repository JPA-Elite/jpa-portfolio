services:
  flask:
    command:
      - sh
      - -c
      - npm run css:build && npx concurrently -k -n CSS,FLASK -c magenta,green "npm run css:watch" "python -m app.app"
    volumes:
      - ./app:/app/app
    environment:
      FLASK_DEBUG: "1"
      CACHE_TYPE: "null"
      TEMPLATE_LIVERELOAD: "1"
      FRONTEND_DIST: "0"
      FRONTEND_DIST_TEMPLATES: "0"
