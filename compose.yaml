services:
  flask:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: ./app/.env
        required: false
    environment:
      PORT: "5000"
    deploy:
      resources:
        reservations:
          cpus: "1.0"
          memory: 512M
    ports:
      - mode: ingress
        target: 5000
        published: 5000
      - mode: ingress
        target: 5000
        published: 80
    healthcheck:
      test: ["CMD", "python3", "-c", "import sys, urllib.request; urllib.request.urlopen(sys.argv[1]).read()", "http://localhost:5000/robots.txt"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      retries: 3